<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamX - Team Overview</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.0.0">
</head>

<body>
    <div class="container">
        <!-- Header with title and QR code -->
        <div class="header">
            <div class="info-section">
                <p class="presenter-name">Quizmaster Klaas presenteert</p>
                <h1 class="show-title">
                    <span id="showName">Loading...</span>
                </h1>
                <p class="subtitle">De teams van vandaag zijn:</p>
            </div>

            <!-- QR Code -->
            <div class="qr-code-container">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https%3A%2F%2Fwww.pinkmilk.eu%2Fteamx%2Fphone%2F%3Fv%3D2.6.0"
                    alt="Team Registration QR Code" class="qr-code">
            </div>
        </div>

        <!-- Teams Display Container -->
        <div id="teamsContainer" class="teams-container">
            <!-- Teams will be dynamically added here -->
        </div>

        <!-- Latest Photos Box (Top Right) -->
        <div id="latestPhotosContainer" class="latest-photos-container" style="display: none;">
            <div class="photo-frame">
                <img id="latestPhotoImg" src="" alt="Laatste foto">
                <div id="latestPhotoCaption" class="photo-caption"></div>
            </div>
        </div>

        <!-- Status indicator -->
        <div class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-text">Live</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/pocketbase@0.22.0/dist/pocketbase.umd.js"></script>
    <script src="config.js?v=2.5.2"></script>
    <script src="script-new.js?v=2.5.2"></script>
</body>

</html>
